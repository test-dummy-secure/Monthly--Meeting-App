<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{subject}}</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f6f8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f6f8;padding:40px 0;">
    <tr>
      <td align="center">
        <table width="600" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;width:100%;background-color:#ffffff;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.08);overflow:hidden;">

          <!-- Header -->
          <tr>
            <td style="background-color:#1A1814;padding:32px 40px;text-align:center;">
              <table cellpadding="0" cellspacing="0" border="0" role="presentation" style="border-collapse:collapse;margin:0 auto;"><tr><td style="font-size:28px;font-weight:700;color:#B8872A;padding-right:10px;vertical-align:middle;line-height:1;">&#8734;</td><td style="vertical-align:middle;padding:0 10px;"><div style="width:1px;height:22px;background-color:#4A4540;"></div></td><td style="vertical-align:middle;"><span style="font-size:21px;font-weight:700;color:#ffffff;letter-spacing:-0.5px;">Nxg</span><span style="font-size:21px;font-weight:300;color:#9B9589;letter-spacing:-0.5px;">Secure</span></td></tr></table>
              <p style="margin:8px 0 0;color:#64748b;font-size:11px;text-transform:uppercase;letter-spacing:1.5px;">Security Management</p>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:40px 40px 24px;">
              <h2 style="margin:0 0 24px;color:#1e293b;font-size:20px;font-weight:600;">{{subject}}</h2>
              <div style="color:#475569;font-size:15px;line-height:1.7;">{{body}}</div>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="background-color:#f8fafc;border-top:1px solid #e2e8f0;padding:24px 40px;text-align:center;">
              <p style="margin:0;color:#94a3b8;font-size:12px;line-height:1.6;">
                This email was sent by the NxgSecure. Do not reply to this email.
              </p>
              <p style="margin:8px 0 0;color:#94a3b8;font-size:12px;">
                &copy; 2026 NxgSecure &mdash; All rights reserved.
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
