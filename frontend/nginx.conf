server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── React SPA ────────────────────────────────────────────────────────────
    # All unmatched routes fall back to index.html so React Router handles them.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API reverse proxy ────────────────────────────────────────────────────
    # Proxies /api/* to the backend container. The browser only ever talks to
    # nginx on port 80 — no direct backend port exposure needed in production.
    location /api {
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 35s — 5s buffer over the backend's 30s hard request timeout
        proxy_read_timeout    35s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    35s;
    }

    # ── Static asset caching ─────────────────────────────────────────────────
    # Vite fingerprints JS/CSS filenames with content hashes, so 1-year
    # immutable caching is safe and eliminates repeat download cost.
    location ~* \.(js|css|woff|woff2|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"                    always;
    add_header X-Content-Type-Options "nosniff"                       always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ── Compression ──────────────────────────────────────────────────────────
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml application/xml+rss text/javascript
                    image/svg+xml;
    gzip_min_length 1024;
    gzip_vary       on;
}
