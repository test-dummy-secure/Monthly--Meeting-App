name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Continuous Integration ─────────────────────────────────────────────────
  ci:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Backend ──────────────────────────────────────────────────────────
      - name: Set up Node (backend)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --legacy-peer-deps

      - name: Lint backend
        working-directory: backend
        run: npm run lint

      - name: Validate backend entry-point syntax
        working-directory: backend
        run: node --check src/server.js

      # ── Frontend ──────────────────────────────────────────────────────────
      - name: Set up Node (frontend)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        env:
          # CI only needs to verify the build compiles — not a real deployment.
          # The actual production URL is injected via GitHub Secret VITE_API_URL
          # when docker-compose builds the frontend container during CD.
          VITE_API_URL: https://placeholder.bmmj.internal/api
        run: npm run build

  # ── Continuous Deployment ──────────────────────────────────────────────────
  # Runs only on push to main (not on PRs) and only after CI passes.
  cd:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Build metadata ─────────────────────────────────────────────────────
      # APP_VERSION   — semver from package.json (e.g. 1.0.0)
      # BUILD_VERSION — first 8 chars of the git SHA (e.g. a1b2c3d4)
      # BUILD_TIME    — UTC ISO timestamp of this run
      - name: Set build metadata
        run: |
          APP_VERSION=$(node -p "require('./backend/package.json').version")
          BUILD_VERSION=${GITHUB_SHA::8}
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "APP_VERSION=$APP_VERSION"       >> "$GITHUB_ENV"
          echo "BUILD_VERSION=$BUILD_VERSION"   >> "$GITHUB_ENV"
          echo "BUILD_TIME=$BUILD_TIME"         >> "$GITHUB_ENV"

      # ── SSH deploy ─────────────────────────────────────────────────────────
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          port:     ${{ secrets.SSH_PORT }}
          # Build metadata forwarded into the remote shell so it can be
          # embedded in .env.production without recomputing on the server.
          envs: APP_VERSION,BUILD_VERSION,BUILD_TIME
          script: |
            set -euo pipefail
            cd /opt/bmmj

            # ── Pull latest code ─────────────────────────────────────────
            git pull origin main

            # ── Generate .env.production from GitHub Secrets ─────────────
            # Written → chmod 600 → read by docker-compose → deleted.
            # Exists on disk only for the seconds docker-compose needs it.
            cat > .env.production << 'ENVEOF'
            PORT=5000
            NODE_ENV=production
            DB_HOST=postgres
            DB_PORT=5432
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            REDIS_HOST=redis
            REDIS_PORT=6379
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_ACCESS_SECRET=${{ secrets.JWT_ACCESS_SECRET }}
            JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
            TOKEN_ENCRYPTION_KEY=${{ secrets.TOKEN_ENCRYPTION_KEY }}
            NXG360_API_BASE_URL=${{ secrets.NXG360_API_BASE_URL }}
            NXG360_ENCRYPTION_KEY=${{ secrets.NXG360_ENCRYPTION_KEY }}
            MS_CLIENT_ID=${{ secrets.MS_CLIENT_ID }}
            MS_CLIENT_SECRET=${{ secrets.MS_CLIENT_SECRET }}
            MS_REDIRECT_URI=${{ secrets.MS_REDIRECT_URI }}
            MS_TENANT_ID=${{ secrets.MS_TENANT_ID }}
            MS_MAIL_SENDER=${{ secrets.MS_MAIL_SENDER }}
            SUPER_ADMIN_EMAIL=${{ secrets.SUPER_ADMIN_EMAIL }}
            SUPER_ADMIN_PASSWORD=${{ secrets.SUPER_ADMIN_PASSWORD }}
            OLLAMA_BASE_URL=${{ secrets.OLLAMA_BASE_URL }}
            OLLAMA_MODEL=${{ secrets.OLLAMA_MODEL }}
            OLLAMA_TIMEOUT=${{ secrets.OLLAMA_TIMEOUT }}
            OLLAMA_NUM_CTX=${{ secrets.OLLAMA_NUM_CTX }}
            OLLAMA_FALLBACK_MODEL=${{ secrets.OLLAMA_FALLBACK_MODEL }}
            AI_CONCURRENCY=${{ secrets.AI_CONCURRENCY }}
            AI_MAX_ITEMS_PER_RUN=${{ secrets.AI_MAX_ITEMS_PER_RUN }}
            CLIENT_URL=${{ secrets.CLIENT_URL }}
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            PUBLIC_API_URL=${{ secrets.PUBLIC_API_URL }}
            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_PORT=${{ secrets.SMTP_PORT }}
            SMTP_SECURE=${{ secrets.SMTP_SECURE }}
            SMTP_USER=${{ secrets.SMTP_USER }}
            SMTP_PASS=${{ secrets.SMTP_PASS }}
            SMTP_FROM=${{ secrets.SMTP_FROM }}
            ENVEOF

            # Appended separately (unquoted) so real bash variable expansion
            # applies — the block above uses a quoted heredoc delimiter on
            # purpose, so that secrets containing $ (e.g. SMTP_PASS) are
            # written literally instead of being misinterpreted as shell
            # variables.
            {
              echo "APP_VERSION=$APP_VERSION"
              echo "BUILD_VERSION=$BUILD_VERSION"
              echo "BUILD_TIME=$BUILD_TIME"
            } >> .env.production

            chmod 600 .env.production

            # ── Build & (re)start containers ─────────────────────────────
            docker-compose --env-file .env.production up -d --build

            # Remove immediately — Docker has already read the values into
            # the container environment.
            rm -f .env.production

            # ── Health-check loop (max 60 s) ─────────────────────────────
            echo "Waiting for backend to become healthy..."
            ATTEMPTS=0
            until curl -sf http://localhost:5000/health > /dev/null; do
              ATTEMPTS=$((ATTEMPTS + 1))
              if [ "$ATTEMPTS" -ge 30 ]; then
                echo "ERROR: backend not healthy after 60 s"
                docker-compose logs --tail=50 backend
                exit 1
              fi
              sleep 2
            done
            echo "Backend healthy after $((ATTEMPTS * 2)) s"

            # ── Prune dangling images ─────────────────────────────────────
            docker image prune -f

            # ── Tag the deployed commit ───────────────────────────────────
            git config user.email "ci@bmmj-deploy"
            git config user.name  "BMMJ CI"
            git tag "v${APP_VERSION}-${BUILD_VERSION}" || true
            git push origin "v${APP_VERSION}-${BUILD_VERSION}" || true

            echo "Deploy complete: v${APP_VERSION}-${BUILD_VERSION} at ${BUILD_TIME}"
