name: DAST Security Scan (OWASP ZAP)

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  # zaproxy/action-baseline opens a GitHub Issue per alert found when the scan
  # report is non-empty - without this it fails with "Resource not accessible
  # by integration" the moment any alert exists.
  issues: write

jobs:
  dast:
    name: DAST (Dynamic Web App Check)
    runs-on: ubuntu-latest
    env:
      # Single source of truth - referenced by both the env-file generation
      # step and the login step below, instead of each hardcoding its own
      # copy (which is exactly how they can silently drift out of sync).
      # Some credential has to exist somewhere for a real login to work at
      # all - config/validate.js hard-requires these just to boot the
      # container - this is as close to credential-free as that allows.
      TEST_SUPER_ADMIN_EMAIL:    admin@test.local
      TEST_SUPER_ADMIN_PASSWORD: TestAdmin2026Secure
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Create environment files matching your exact docker-compose variables
      - name: Create Environment Files
        run: |
          echo "VITE_API_URL=https://api.test.local" >> .env
          echo "DB_NAME=BMMJ" >> .env
          echo "DB_USER=bmmj_user" >> .env
          echo "DB_PASSWORD=testpassword" >> .env
          echo "REDIS_PASSWORD=testpassword" >> .env
          echo "JWT_ACCESS_SECRET=test-super-secret-access-token-key-12345" >> .env
          echo "JWT_REFRESH_SECRET=test-super-secret-refresh-token-key-12345" >> .env
          # config/validate.js hard-fails in production unless these are also
          # set to non-default values - without them the backend crash-loops
          # at boot before ever reaching a DB connection or the healthcheck.
          echo "NXG360_ENCRYPTION_KEY=$(openssl rand -hex 32)" >> .env
          echo "TOKEN_ENCRYPTION_KEY=$(openssl rand -hex 32)" >> .env
          echo "CLIENT_URL=https://app.test.local" >> .env
          echo "SMTP_USER=test@test.local" >> .env
          echo "SMTP_PASS=testsmtppass" >> .env
          echo "SMTP_FROM=NxgSecure Test <test@test.local>" >> .env
          echo "MS_CLIENT_ID=00000000-0000-0000-0000-000000000000" >> .env
          echo "SUPER_ADMIN_EMAIL=$TEST_SUPER_ADMIN_EMAIL" >> .env
          echo "SUPER_ADMIN_PASSWORD=$TEST_SUPER_ADMIN_PASSWORD" >> .env
          cp .env .env.production

      # 2. Start Application Stack via Docker Compose
      - name: Start Application Stack via Docker Compose
        run: docker compose up -d

      # 3. Wait for the backend health check to pass
      - name: Wait for Backend Health Check
        run: |
          echo "Waiting for backend to respond..."
          for i in {1..30}; do
            if curl -sf http://localhost:5000/health || curl -sf http://localhost:5000/; then
              echo "Backend is up!"
              exit 0
            fi
            sleep 3
          done
          echo "Backend failed to start in time"
          exit 1

      # 4. Debug Logs if Health Check Fails
      - name: Debug Container Logs on Failure
        if: failure()
        run: |
          echo "=== DOCKER COMPOSE STATUS ==="
          docker compose ps
          echo "=== BACKEND LOGS ==="
          docker compose logs backend
          echo "=== DATABASE LOGS ==="
          docker compose logs postgres

      # 5. Ensure the workspace is writable by the ZAP container
      # zaproxy/action-baseline runs ZAP as a different container UID than the
      # one that checked out the workspace - without this, it fails to write
      # its own report with "AccessDeniedException /zap/wrk/<file>". Safe here:
      # this is an ephemeral CI runner, destroyed right after the job.
      - name: Ensure workspace is writable by ZAP container
        run: chmod -R 777 "$GITHUB_WORKSPACE"

      # 6. Log in and generate ZAP's auth config, so the scan covers real
      # protected endpoints (meetings, tasks, etc.), not just /health and
      # /api/docs. No new secrets needed - this logs in for real using the
      # SUPER_ADMIN_EMAIL/PASSWORD already generated above (the backend
      # auto-bootstraps that exact account on startup), and injects the
      # freshly-issued token via ZAP's Replacer add-on. A pre-stored static
      # token would NOT work here - this app's JWTs expire in 15 minutes
      # (config/index.js jwtExpiresIn), so it would already be dead by scan
      # time; logging in fresh every run avoids that entirely.
      # zap-auth.conf is never committed - generated fresh each run, and
      # listed in .gitignore as a backup safety net regardless.
      - name: Authenticate and Generate ZAP Auth Config
        run: |
          TOKEN=$(curl -sf -X POST http://localhost:5000/api/auth/login \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$TEST_SUPER_ADMIN_EMAIL\",\"password\":\"$TEST_SUPER_ADMIN_PASSWORD\"}" \
            | python3 -c "import sys, json; print(json.load(sys.stdin)['accessToken'])")
          if [ -z "$TOKEN" ]; then
            echo "::warning::Could not obtain an access token - scan will run unauthenticated"
          fi
          cat << EOF > zap-auth.conf
          replacer.full_list(0).description=AuthHeader
          replacer.full_list(0).enabled=true
          replacer.full_list(0).matchtype=REQ_HEADER
          replacer.full_list(0).matchstr=Authorization
          replacer.full_list(0).regex=false
          replacer.full_list(0).replacement=Bearer $TOKEN
          EOF

      # 7. Run OWASP ZAP Baseline Scan
      # report_format/output_file were never real inputs for this action -
      # they were silently ignored, which is why zap-report.xml never existed
      # downstream. The real way to control the output report is cmd_options
      # (passed straight to the underlying zap-baseline.py script: -x for
      # XML, -z to pass the auth config through to the underlying ZAP
      # process). artifact_name overrides the action's own default internal
      # artifact upload (its unnamed default, "zap_scan", was being rejected
      # by the artifact API) - giving it a unique name here also means we
      # don't need a separate, redundant upload-artifact step afterward.
      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:5000'
          fail_action: false
          cmd_options: '-x zap-report.xml -z "-configfile zap-auth.conf"'
          artifact_name: 'zap-report-${{ github.run_id }}'

      # 8. Upload scan to Security Platform (NXG Secure / DefectDojo)
      - name: Upload scan to Security Platform
        if: always()
        shell: bash
        run: |
          echo "Uploading ZAP scan report to NXG Portal..."
          curl -v -X POST "https://nxg.app.nxgsecure.com/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.SECURITY_PLATFORM_TOKEN }}" \
            -F auto_create_context=true \
            -F product_type_name="${{ github.repository_owner }}" \
            -F product_name="${{ github.event.repository.name }}" \
            -F engagement_name="DAST" \
            -F scan_type="ZAP Scan" \
            -F file=@zap-report.xml

      # 9. Clean up containers
      - name: Clean Up Stack
        if: always()
        run: docker compose down