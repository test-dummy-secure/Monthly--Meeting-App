name: DAST Security Scan (OWASP ZAP)

# ─────────────────────────────────────────────────────────────────────────
# ADOPTING THIS WORKFLOW IN ANOTHER REPO (client handoff notes)
# This file assumes the target app:
#   1. Exposes a health endpoint returning HTTP 200 when ready (here: /health)
#   2. Publishes a machine-readable OpenAPI/Swagger spec (here: /api/docs.json)
#      - the API scan step can ONLY test what is actually listed there, so an
#        incomplete spec means incomplete scan coverage, silently.
#   3. Boots with test credentials supplied via env vars, and exposes a JSON
#      login endpoint returning an access token (here: POST /api/auth/login)
#   4. Ships a docker-compose.yml that brings up the full stack locally
# The "Create Environment Files" step below inherits the target app's own
# .env.example / .env.production.example when one exists (so real
# integration/DB/SMTP config isn't clobbered), and only force-generates the
# handful of fields that have strict format validation at boot - a bare
# "does this key name already exist" check isn't enough for those, since
# example files conventionally ship them as human-fill-in placeholders
# ("replace_with_64_char_hex_key") that would otherwise be accepted as real
# and crash the app at startup.
# The "Seed Test Data" step auto-detects SEED_SCRIPT_PATH inside the running
# container and skips cleanly if it isn't there, or if DAST_SKIP_SEED is set -
# not every organization ships or wants seed data used for this scan.
# STRICT_HEX64_VARS / STRICT_MIN32_VARS / ADMIN_EMAIL_VAR / ADMIN_PASSWORD_VAR
# / APP_PORT / HEALTH_PATH / OPENAPI_SPEC_PATH / LOGIN_PATH /
# LOGIN_EMAIL_FIELD / LOGIN_PASSWORD_FIELD / LOGIN_TOKEN_FIELD /
# BACKEND_SERVICE / DB_SERVICE (below, in the job env) are the ONLY
# app-specific values in this file - edit them for a different target app
# rather than hunting through the script logic for hardcoded strings.
# Requires: repo variable REPORT_ONLY ('true'|'false'), repo secret
# SECURITY_PLATFORM_TOKEN (DefectDojo/NXG Secure API token).
# ─────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  dast:
    name: DAST (Dynamic Web App Check)
    runs-on: ubuntu-latest
    env:
      TEST_SUPER_ADMIN_EMAIL:    admin@test.local
      TEST_SUPER_ADMIN_PASSWORD: TestAdmin2026Secure
      SEED_SCRIPT_PATH: src/database/seed.js
      # ── Customize this block for a different target app; blank out any
      # line that doesn't apply. Nothing here is app-agnostic logic - these
      # are just the NAMES this app happens to use, moved out of the script
      # below so a different app's names go here instead of being hunted
      # down inside bash functions. ───────────────────────────────────────
      # Comma-separated ENV VAR NAMES your app's own startup validator
      # requires to be a 64-character hex string (e.g. AES-256 keys).
      STRICT_HEX64_VARS: "NXG360_ENCRYPTION_KEY,TOKEN_ENCRYPTION_KEY"
      # Comma-separated ENV VAR NAMES your app's own startup validator
      # requires to be at least 32 characters long (e.g. JWT signing secrets).
      STRICT_MIN32_VARS: "JWT_ACCESS_SECRET,JWT_REFRESH_SECRET"
      # The ENV VAR NAMES your app bootstraps its one admin/test login
      # account from - the login step below authenticates with the values
      # of TEST_SUPER_ADMIN_EMAIL/PASSWORD above, written out under
      # whatever names you set here.
      ADMIN_EMAIL_VAR:    SUPER_ADMIN_EMAIL
      ADMIN_PASSWORD_VAR: SUPER_ADMIN_PASSWORD
      # ── Target app's shape - edit for a different app ───────────────────
      APP_PORT:          5000
      HEALTH_PATH:       /health
      OPENAPI_SPEC_PATH: /api/docs.json
      LOGIN_PATH:        /api/auth/login
      LOGIN_EMAIL_FIELD:    email
      LOGIN_PASSWORD_FIELD: password
      LOGIN_TOKEN_FIELD:    accessToken
      # docker-compose.yml service names for the app container and its DB -
      # used by the health/debug/seed steps below.
      BACKEND_SERVICE: backend
      DB_SERVICE:      postgres
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Create environment files - start from the target app's own example
      - name: Create Environment Files
        run: |
          if [ -f ".env.production.example" ]; then
            echo "Found .env.production.example - using it as the base."
            cp .env.production.example .env.production
          elif [ -f ".env.example" ]; then
            echo "Found .env.example - using it as the base."
            cp .env.example .env.production
          else
            touch .env.production
          fi

          # Fields with no strict format validation at boot - safe to keep
          # whatever the client's own example file already set; only fill in
          # if genuinely absent.
          grep -q "^VITE_API_URL="    .env.production || echo "VITE_API_URL=https://api.test.local"           >> .env.production
          grep -q "^DB_NAME="         .env.production || echo "DB_NAME=BMMJ"                                   >> .env.production
          grep -q "^DB_USER="         .env.production || echo "DB_USER=bmmj_user"                              >> .env.production
          grep -q "^DB_PASSWORD="     .env.production || echo "DB_PASSWORD=testpassword"                      >> .env.production
          grep -q "^REDIS_PASSWORD="  .env.production || echo "REDIS_PASSWORD=testpassword"                   >> .env.production
          grep -q "^CLIENT_URL="      .env.production || echo "CLIENT_URL=https://app.test.local"             >> .env.production
          grep -q "^SMTP_USER="       .env.production || echo "SMTP_USER=test@test.local"                     >> .env.production
          grep -q "^SMTP_PASS="       .env.production || echo "SMTP_PASS=testsmtppass"                        >> .env.production
          grep -q "^SMTP_FROM="       .env.production || echo "SMTP_FROM=NxgSecure Test <test@test.local>"    >> .env.production
          grep -q "^MS_CLIENT_ID="    .env.production || echo "MS_CLIENT_ID=00000000-0000-0000-0000-000000000000" >> .env.production

          # Fields config/validate.js hard-fails the boot on if their VALUE is
          # wrong shape - not just missing. An example file almost always
          # ships these as human-fill-in placeholders ("replace_with_64_char_
          # hex_key"), which a bare "does the key name exist" check would
          # wrongly accept as real, crash-looping the backend at boot. Read
          # the current value back out and validate its actual shape before
          # deciding to keep it.
          get_env_value() { sed -n "s/^$1=//p" .env.production | tail -n1; }

          force_hex64() {
            local key="$1" current
            current=$(get_env_value "$key")
            if ! [[ "$current" =~ ^[0-9a-fA-F]{64}$ ]]; then
              sed -i "/^${key}=/d" .env.production
              echo "${key}=$(openssl rand -hex 32)" >> .env.production
            fi
          }
          IFS=',' read -ra _hex64_keys <<< "$STRICT_HEX64_VARS"
          for key in "${_hex64_keys[@]}"; do
            [ -n "$key" ] && force_hex64 "$key"
          done

          force_long_secret() {
            local key="$1" current
            current=$(get_env_value "$key")
            if [ "${#current}" -lt 32 ]; then
              sed -i "/^${key}=/d" .env.production
              echo "${key}=$(openssl rand -hex 32)" >> .env.production
            fi
          }
          IFS=',' read -ra _min32_keys <<< "$STRICT_MIN32_VARS"
          for key in "${_min32_keys[@]}"; do
            [ -n "$key" ] && force_long_secret "$key"
          done

          # The admin/test login credentials are forced unconditionally,
          # never inherited - the login step later in this job authenticates
          # with exactly $TEST_SUPER_ADMIN_EMAIL/$TEST_SUPER_ADMIN_PASSWORD,
          # so whatever actually gets bootstrapped must match those,
          # regardless of any placeholder a client's example file contains.
          if [ -n "$ADMIN_EMAIL_VAR" ]; then
            sed -i "/^${ADMIN_EMAIL_VAR}=/d" .env.production
            echo "${ADMIN_EMAIL_VAR}=$TEST_SUPER_ADMIN_EMAIL" >> .env.production
          fi
          if [ -n "$ADMIN_PASSWORD_VAR" ]; then
            sed -i "/^${ADMIN_PASSWORD_VAR}=/d" .env.production
            echo "${ADMIN_PASSWORD_VAR}=$TEST_SUPER_ADMIN_PASSWORD" >> .env.production
          fi

          cp .env.production .env

      # 2. Start Application Stack via Docker Compose
      - name: Start Application Stack via Docker Compose
        run: docker compose up -d

      # 3. Wait for the backend health check to pass
      - name: Wait for Backend Health Check
        run: |
          echo "Waiting for backend to respond..."
          for i in {1..30}; do
            if curl -sf "http://localhost:$APP_PORT$HEALTH_PATH" || curl -sf "http://localhost:$APP_PORT/"; then
              echo "Backend is up!"
              exit 0
            fi
            sleep 3
          done
          echo "Backend failed to start in time"
          exit 1

      # 4. Debug Logs if Health Check Fails
      - name: Debug Container Logs on Failure
        if: failure()
        run: |
          echo "=== DOCKER COMPOSE STATUS ==="
          docker compose ps
          echo "=== BACKEND LOGS ==="
          docker compose logs "$BACKEND_SERVICE"
          echo "=== DATABASE LOGS ==="
          docker compose logs "$DB_SERVICE"

      # 5. Populate realistic test data, if the target app has a seed script -
      # without this every list endpoint returns [] and every :id route has
      # no real ID to attack, so findings end up artificially low (header/
      # config issues only).
      - name: Seed Test Data (optional)
        run: |
          if [ "${{ vars.DAST_SKIP_SEED }}" = "true" ]; then
            echo "DAST_SKIP_SEED is set - skipping test data seed."
          elif docker compose exec -T "$BACKEND_SERVICE" test -f "$SEED_SCRIPT_PATH"; then
            echo "Found $SEED_SCRIPT_PATH - populating test data..."
            docker compose exec -T "$BACKEND_SERVICE" node "$SEED_SCRIPT_PATH"
          else
            echo "No seed script at $SEED_SCRIPT_PATH - skipping. Scan will run against an empty database; findings may be limited to what's reachable without real IDs."
          fi

      # 6. Ensure the workspace is writable by the ZAP container
      - name: Ensure workspace is writable by ZAP container
        run: chmod -R 777 "$GITHUB_WORKSPACE"

      # 7. Log in and generate ZAP's auth config, so the scan covers real
      # protected endpoints (meetings, tasks, etc.), not just /health and
      # /api/docs. 
      - name: Authenticate and Generate ZAP Auth Config
        run: |
          TOKEN=$(curl -sf -X POST "http://localhost:$APP_PORT$LOGIN_PATH" \
            -H "Content-Type: application/json" \
            -d "{\"$LOGIN_EMAIL_FIELD\":\"$TEST_SUPER_ADMIN_EMAIL\",\"$LOGIN_PASSWORD_FIELD\":\"$TEST_SUPER_ADMIN_PASSWORD\"}" \
            | python3 -c "import sys, json; print(json.load(sys.stdin).get('$LOGIN_TOKEN_FIELD',''))")
          if [ -z "$TOKEN" ]; then
            echo "::warning::Could not obtain an access token - scan will run unauthenticated"
          fi
          cat << EOF > zap-auth.conf
          replacer.full_list(0).description=AuthHeader
          replacer.full_list(0).enabled=true
          replacer.full_list(0).matchtype=REQ_HEADER
          replacer.full_list(0).matchstr=Authorization
          replacer.full_list(0).regex=false
          replacer.full_list(0).replacement=Bearer $TOKEN
          EOF

      # 8. Run OWASP ZAP Baseline Scan - direct docker run, not the action.
      - name: Run OWASP ZAP Baseline Scan
        continue-on-error: ${{ vars.REPORT_ONLY == 'true' }}
        run: |
          docker pull ghcr.io/zaproxy/zaproxy:stable
          docker run --rm -v "$GITHUB_WORKSPACE:/zap/wrk/:rw" --network=host -t \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t "http://localhost:$APP_PORT" \
            -x zap-report.xml \
            -z "-configfile /zap/wrk/zap-auth.conf"

      # 9. Keep the report as a downloadable artifact
      - name: Keep the report (downloadable for 90 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report-${{ github.run_id }}
          path: zap-report.xml
          if-no-files-found: warn

      # 10. Run OWASP ZAP API Scan, driven by the real OpenAPI spec.
      - name: Run OWASP ZAP API Scan (OpenAPI)
        continue-on-error: ${{ vars.REPORT_ONLY == 'true' }}
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/zap/wrk/:rw" --network=host -t \
            ghcr.io/zaproxy/zaproxy:stable zap-api-scan.py \
            -t "http://localhost:$APP_PORT$OPENAPI_SPEC_PATH" \
            -f openapi \
            -x api-scan-report.xml \
            -z "-configfile /zap/wrk/zap-auth.conf"

      # 11. Keep the API scan report as a downloadable artifact
      - name: Keep the API scan report (downloadable for 90 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-scan-report-${{ github.run_id }}
          path: api-scan-report.xml
          if-no-files-found: warn

      # 12. Upload scans to Security Platform (NXG Secure / DefectDojo).
      - name: Upload scans to Security Platform (NXG Secure / DefectDojo)
        if: always()
        shell: bash
        run: |
          if [ -s zap-report.xml ]; then
            echo "Uploading ZAP baseline scan report to NXG Portal..."
            curl -v -X POST "https://nxg.app.nxgsecure.com/api/v2/reimport-scan/" \
              -H "Authorization: Token ${{ secrets.SECURITY_PLATFORM_TOKEN }}" \
              -F auto_create_context=true \
              -F product_type_name="${{ github.repository_owner }}" \
              -F product_name="${{ github.event.repository.name }}" \
              -F engagement_name="DAST" \
              -F test_title="DAST - ZAP Baseline" \
              -F scan_type="ZAP Scan" \
              -F file=@zap-report.xml \
              -F close_old_findings=true || true
          else
            echo "zap-report.xml is missing or empty, skipping upload."
          fi

          if [ -s api-scan-report.xml ]; then
            echo "Uploading ZAP API scan report to NXG Portal..."
            curl -v -X POST "https://nxg.app.nxgsecure.com/api/v2/reimport-scan/" \
              -H "Authorization: Token ${{ secrets.SECURITY_PLATFORM_TOKEN }}" \
              -F auto_create_context=true \
              -F product_type_name="${{ github.repository_owner }}" \
              -F product_name="${{ github.event.repository.name }}" \
              -F engagement_name="DAST" \
              -F test_title="DAST - ZAP API Scan" \
              -F scan_type="ZAP Scan" \
              -F file=@api-scan-report.xml \
              -F close_old_findings=true || true
          else
            echo "api-scan-report.xml is missing or empty, skipping upload."
          fi

      # 13. Clean up containers
      - name: Clean Up Stack
        if: always()
        run: docker compose down