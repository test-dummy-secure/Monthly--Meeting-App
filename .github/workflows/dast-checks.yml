name: DAST Security Scan (OWASP ZAP)

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target Application URL'
        required: true
        default: 'http://localhost:5000'

jobs:
  dast:
    name: DAST (Dynamic Web App Check)
    runs-on: ubuntu-latest
    env:
      LOGIN_ENDPOINT: ${{ vars.DAST_LOGIN_ENDPOINT || '/api/auth/login' }}
      TEST_EMAIL: ${{ vars.DAST_TEST_EMAIL || 'admin@test.local' }}
      TEST_PASSWORD: ${{ secrets.DAST_TEST_PASSWORD || 'DefaultSecurePassword123' }}
      OPENAPI_SPEC_PATH: ${{ vars.DAST_OPENAPI_PATH || '/api/docs.json' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Adapt to Client's Environment Files (.env, .env.example, or .env.production.example)
      - name: Setup Client Environment Variables
        run: |
          if [ -f ".env.production.example" ]; then
            echo "Found .env.production.example - copying to .env.production..."
            cp .env.production.example .env.production
          elif [ -f ".env.example" ]; then
            echo "Found .env.example - copying to .env.production..."
            cp .env.example .env.production
          elif [ -f ".env.sample" ]; then
            echo "Found .env.sample - copying to .env.production..."
            cp .env.sample .env.production
          else
            echo "No example env files found, generating a standard base .env.production..."
            touch .env.production
          fi

          # Ensure a base .env exists for docker-compose compatibility
          if [ ! -f ".env" ]; then
            cp .env.production .env
          fi

          # Safely append mandatory test credentials without breaking custom configurations
          echo "" >> .env.production
          echo "# Added automatically by NXGSecure DAST Pipeline" >> .env.production
          grep -q "SUPER_ADMIN_EMAIL" .env.production || echo "SUPER_ADMIN_EMAIL=$TEST_EMAIL" >> .env.production
          grep -q "SUPER_ADMIN_PASSWORD" .env.production || echo "SUPER_ADMIN_PASSWORD=$TEST_PASSWORD" >> .env.production
          grep -q "JWT_ACCESS_SECRET" .env.production || echo "JWT_ACCESS_SECRET=test-super-secret-access-token-key-12345" >> .env.production

          # Sync .env with the updated production file
          cp .env.production .env
          echo "Environment and production variables successfully initialized."

      # 2. Start Application Stack via Docker Compose
      - name: Start Application Stack via Docker Compose
        run: docker compose up -d

      # 3. Flexible Health Check
      - name: Wait for Backend Health Check
        run: |
          echo "Waiting for application to respond..."
          for i in {1..30}; do
            if curl -sf http://localhost:5000/health || curl -sf http://localhost:5000/; then
              echo "Application is up!"
              exit 0
            fi
            sleep 3
          done
          echo "Application failed to start in time"
          exit 1

      # 4. Optional Test Data Seeding
      - name: Seed Test Data (Optional)
        run: |
          if [ -f "src/database/seed.js" ]; then
            echo "Running default seed script..."
            docker compose exec -T backend node src/database/seed.js
          elif [ -f "package.json" ] && grep -q "seed" package.json; then
            echo "Running npm seed script..."
            docker compose exec -T backend npm run seed
          else
            echo "No standard seed script detected, skipping..."
          fi

      - name: Ensure workspace is writable by ZAP container
        run: chmod -R 777 "$GITHUB_WORKSPACE"

      # 5. Dynamic Authentication Generation
      - name: Generate Dynamic ZAP Auth Config
        if: ${{ env.LOGIN_ENDPOINT != '' }}
        run: |
          echo "Attempting to authenticate against $LOGIN_ENDPOINT..."
          TOKEN=$(curl -sf -X POST http://localhost:5000${{ env.LOGIN_ENDPOINT }} \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$TEST_EMAIL\",\"password\":\"$TEST_PASSWORD\"}" \
            | python3 -c "import sys, json; res = json.load(sys.stdin); print(res.get('accessToken') or res.get('token') or '')")
          
          if [ -z "$TOKEN" ]; then
            echo "::warning::Could not obtain an access token - scan will run unauthenticated"
          else
            echo "Successfully obtained authentication token for DAST scan."
            cat << EOF > zap-auth.conf
            replacer.full_list(0).description=AuthHeader
            replacer.full_list(0).enabled=true
            replacer.full_list(0).matchtype=REQ_HEADER
            replacer.full_list(0).matchstr=Authorization
            replacer.full_list(0).regex=false
            replacer.full_list(0).replacement=Bearer $TOKEN
            EOF
          fi

      # 6. Run ZAP API Scan dynamically
      - name: Run OWASP ZAP API Scan
        run: |
          SPEC_URL="http://localhost:5000${{ env.OPENAPI_SPEC_PATH }}"
          AUTH_FLAG=""
          if [ -f "zap-auth.conf" ]; then
            AUTH_FLAG="-z \"-configfile /zap/wrk/zap-auth.conf\""
          }

          docker pull ghcr.io/zaproxy/zaproxy:stable
          docker run -v "$GITHUB_WORKSPACE:/zap/wrk/:rw" --network=host -t \
            ghcr.io/zaproxy/zaproxy:stable zap-api-scan.py \
            -t "$SPEC_URL" \
            -f openapi \
            -x api-scan-report.xml \
            $AUTH_FLAG || true

      - name: Keep the report (downloadable for 90 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-scan-report-${{ github.run_id }}
          path: api-scan-report.xml
          if-no-files-found: warn

      # 7. Upload to DefectDojo using reimport-scan
      - name: Upload to NXG Secure / DefectDojo
        if: always()
        shell: bash
        run: |
          if [ -s api-scan-report.xml ]; then
            curl -sf -X POST "https://nxg.app.nxgsecure.com/api/v2/reimport-scan/" \
              -H "Authorization: Token ${{ secrets.SECURITY_PLATFORM_TOKEN }}" \
              -F auto_create_context=true \
              -F product_type_name="${{ github.repository_owner }}" \
              -F product_name="${{ github.event.repository.name }}" \
              -F engagement_name="DAST" \
              -F test_title="DAST - ZAP API Scan" \
              -F scan_type="ZAP Scan" \
              -F file=@api-scan-report.xml \
              -F close_old_findings=true || true
          fi

      - name: Clean Up Stack
        if: always()
        run: docker compose down